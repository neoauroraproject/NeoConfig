services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: NeoConfig
      POSTGRES_PASSWORD: NeoConfig
      POSTGRES_DB: NeoConfig
    volumes:
      - NeoConfig_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U NeoConfig -d NeoConfig"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://NeoConfig:NeoConfig@db:5432/NeoConfig?schema=public
      PORT: "4000"
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:4000}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  NeoConfig_pg:
