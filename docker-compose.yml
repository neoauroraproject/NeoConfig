# Fixed project name: containers are neoconfig-*, whatever the folder is called.
name: neoconfig

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neoconfig
      POSTGRES_PASSWORD: neoconfig
      POSTGRES_DB: neoconfig
    volumes:
      - neoconfig_pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neoconfig -d neoconfig"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://neoconfig:neoconfig@db:5432/neoconfig?schema=public
      PORT: "4000"
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        API_INTERNAL_URL: http://api:4000
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  # Public entry point: HTTPS for every brand domain, certificates issued on demand.
  proxy:
    image: caddy:2-alpine
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  neoconfig_pg:
  caddy_data:
  caddy_config:
