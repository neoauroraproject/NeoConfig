# Local development database only. Production runs natively (see install.sh):
#   docker compose up -d db
name: neoconfig-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neoconfig
      POSTGRES_PASSWORD: neoconfig
      POSTGRES_DB: neoconfig
    volumes:
      - neoconfig_pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neoconfig -d neoconfig"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  neoconfig_pg:
